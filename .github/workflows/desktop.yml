name: Desktop builds

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: windows-x64
          - os: ubuntu-22.04
            artifact: linux-x64
          - os: ubuntu-24.04
            artifact: linux-ubuntu-24.04-x64
          - os: macos-26-intel
            artifact: macos-intel
          - os: macos-26
            artifact: macos-arm64
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      MARBLE_SMOKE_OUTPUT: marbledesk/.verification/studio
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            marbledesk/requirements*.txt
      - name: Linux Qt runtime dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libxkbcommon0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0
      - name: Install build dependencies
        run: python -m pip install -r marbledesk/requirements-build.txt
      - name: Core regression tests
        run: python -m unittest discover -s tests -q
      - name: Desktop regression tests
        run: python -m unittest discover -s marbledesk/tests -q
      - name: Desktop workflow smoke test
        run: python -m marbledesk.marble_studio --smoke-test
      - name: Package desktop application
        run: python -m PyInstaller --noconfirm --distpath marbledesk/dist --workpath marbledesk/build marbledesk/MarblesByMJD.spec
      - name: Test Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $process = Start-Process -FilePath 'marbledesk/dist/marbles by MJD/marbles by MJD.exe' -ArgumentList '--smoke-test' -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Packaged smoke test failed: $($process.ExitCode)" }
      - name: Test Linux package
        if: runner.os == 'Linux'
        run: '"marbledesk/dist/marbles by MJD/marbles by MJD" --smoke-test'
      - name: Test macOS package
        if: runner.os == 'macOS'
        run: '"marbledesk/dist/marbles by MJD.app/Contents/MacOS/marbles by MJD" --smoke-test'
      - name: Archive Windows portable folder
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -LiteralPath 'marbledesk/dist/marbles by MJD' -DestinationPath marbledesk/dist/marbles-by-MJD-${{ matrix.artifact }}.zip
      - name: Archive Linux portable folder
        if: runner.os == 'Linux'
        run: tar -czf marbledesk/dist/marbles-by-MJD-${{ matrix.artifact }}.tar.gz -C marbledesk/dist 'marbles by MJD'
      - name: Archive macOS application
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent 'marbledesk/dist/marbles by MJD.app' marbledesk/dist/marbles-by-MJD-${{ matrix.artifact }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: marbles-by-MJD-${{ matrix.artifact }}
          path: |
            marbledesk/dist/*.zip
            marbledesk/dist/*.tar.gz
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-screenshots-${{ matrix.artifact }}
          path: marbledesk/.verification/studio/
